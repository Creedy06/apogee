[project]
name = "apogee"
version = "0.1.0"
description = "Rocket telemetry decoder (CRC-16, resync, packet loss) with a Kalman-filtered altitude estimate"
requires-python = ">=3.10"

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
